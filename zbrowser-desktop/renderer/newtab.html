<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новая вкладка</title>
  <style>
    /* ============================================================
       Aero — простая стартовая страница: приветствие + быстрые ссылки.
       Никаких виджетов и накладных панелей — как в настоящем браузере.

       Работает внутри <webview> (file://, десктоп) и внутри <iframe>
       (/aera/newtab.html, веб-песочница). Все пути — относительные.

       Связь с хостом (app.js):
         → навигация:  parent.postMessage({__zaeranav:true, url, tab})
         ← хост шлёт:  {__zaeratheme} {__zaerawallpaper}
       Настройки читаются из общего key 'aera.settings.v2' (Store).
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --zb-smooth: cubic-bezier(0.32, 0.72, 0, 1);
      --zb-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --accent: #0a84ff;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --text: #f5f5f7;
      --text-2: rgba(245, 245, 247, 0.72);
      --tile-bg: rgba(28, 28, 34, 0.55);
      --tile-border: rgba(255, 255, 255, 0.14);
      --tile-hover: rgba(255, 255, 255, 0.55);
      --glass: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --text: #1d1d1f;
      --text-2: rgba(29, 29, 31, 0.62);
      --tile-bg: rgba(255, 255, 255, 0.72);
      --tile-border: rgba(0, 0, 0, 0.07);
      --tile-hover: rgba(0, 0, 0, 0.09);
      --glass: rgba(0, 0, 0, 0.045);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    }

    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background: #16161f;
    }

    /* ---------------- Обои ---------------- */
    body.wp-aurora   { background: radial-gradient(120% 90% at 20% 10%, #2b1055 0%, transparent 55%), radial-gradient(110% 100% at 85% 20%, #0f3460 0%, transparent 60%), radial-gradient(130% 110% at 60% 100%, #7597de33 0%, transparent 55%), linear-gradient(150deg, #16161f 0%, #1d1b2e 45%, #171722 100%); }
    body.wp-sunset   { background: radial-gradient(110% 80% at 15% 15%, #ff9a5622 0%, transparent 55%), radial-gradient(120% 90% at 90% 30%, #ff5e6222 0%, transparent 60%), linear-gradient(160deg, #20161a 0%, #2a1a20 50%, #1a1216 100%); }
    body.wp-forest   { background: radial-gradient(120% 90% at 25% 15%, #1d3a2f33 0%, transparent 55%), radial-gradient(110% 100% at 80% 80%, #2a5a3f22 0%, transparent 60%), linear-gradient(155deg, #131a16 0%, #1a2620 50%, #121815 100%); }
    body.wp-ocean    { background: radial-gradient(120% 90% at 20% 20%, #0a4d6e33 0%, transparent 55%), radial-gradient(110% 100% at 85% 75%, #096b8f22 0%, transparent 60%), linear-gradient(150deg, #0e1418 0%, #122430 55%, #0e151a 100%); }
    body.wp-graphite { background: radial-gradient(130% 100% at 30% 10%, #ffffff0d 0%, transparent 50%), linear-gradient(160deg, #1a1a1e 0%, #202026 55%, #17171b 100%); }
    body.wp-rose     { background: radial-gradient(120% 90% at 25% 12%, #8f2d5630 0%, transparent 55%), radial-gradient(110% 100% at 80% 85%, #b0306022 0%, transparent 60%), linear-gradient(150deg, #1a1016 0%, #241521 50%, #161014 100%); }
    body.wp-custom   { background: #16161f; }
    body.wp-custom::before {
      content: ""; position: fixed; inset: 0; z-index: 0;
      background-image: var(--wp-img, none);
      background-size: cover; background-position: center;
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 0;
      background: rgba(0, 0, 0, var(--wp-dim, 0.2)); pointer-events: none;
    }
    html[data-theme="light"] body.wp-aurora   { background: radial-gradient(120% 90% at 20% 10%, #ffe3c2 0%, transparent 55%), radial-gradient(110% 100% at 85% 20%, #ffd9e8 0%, transparent 60%), linear-gradient(150deg, #fdf6ee 0%, #f4eef8 45%, #eef1f7 100%); }
    html[data-theme="light"] body.wp-sunset   { background: radial-gradient(110% 80% at 15% 15%, #ffd9b8 0%, transparent 55%), radial-gradient(120% 90% at 90% 30%, #ffc4c9 0%, transparent 60%), linear-gradient(160deg, #fff3ec 0%, #ffe9ec 50%, #fdeef0 100%); }
    html[data-theme="light"] body.wp-forest   { background: radial-gradient(120% 90% at 25% 15%, #d9f0dd 0%, transparent 55%), linear-gradient(155deg, #f2f8f3 0%, #eaf4ec 50%, #f0f7f1 100%); }
    html[data-theme="light"] body.wp-ocean    { background: radial-gradient(120% 90% at 20% 20%, #d3ecf7 0%, transparent 55%), linear-gradient(150deg, #eff7fb 0%, #e6f2f8 55%, #eef5f9 100%); }
    html[data-theme="light"] body.wp-graphite { background: radial-gradient(130% 100% at 30% 10%, #ffffff 0%, transparent 50%), linear-gradient(160deg, #f7f7f9 0%, #eeeef1 55%, #f4f4f6 100%); }
    html[data-theme="light"] body.wp-rose     { background: radial-gradient(120% 90% at 25% 12%, #fbdde9 0%, transparent 55%), linear-gradient(150deg, #fdf0f4 0%, #f9e6ee 50%, #fdeff2 100%); }
    html[data-theme="light"] body::after { background: rgba(0,0,0,0) !important; }

    /* ---------------- Угловая кнопка ---------------- */
    .corner-tools { position: fixed; top: 14px; right: 16px; z-index: 5; }
    .corner-btn {
      appearance: none; border: 0; cursor: pointer;
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 10px; color: var(--text-2);
      background: var(--tile-bg); border: 1px solid var(--tile-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(30px) saturate(170%);
      -webkit-backdrop-filter: blur(30px) saturate(170%);
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }
    .corner-btn:hover { color: var(--text); background: var(--tile-hover); }
    .corner-btn:active { transform: scale(0.92); }

    /* ---------------- Центральная колонка ---------------- */
    .wrap {
      position: relative; z-index: 1;
      width: min(860px, 96vw);
      margin: 0 auto;
      padding: 34px 22px 60px;
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column;
      justify-content: center; justify-content: safe center;
      align-items: center;
    }
    .wrap > * { animation: zb-fade-up 0.55s var(--zb-smooth) both; }

    @keyframes zb-fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .greeting { text-align: center; animation-delay: 0ms; }
    .greeting h1 { font-size: 27px; font-weight: 700; letter-spacing: 0.2px; }
    .greeting p { margin-top: 6px; font-size: 13.5px; color: var(--text-2); }

    /* ---------------- Быстрые ссылки ---------------- */
    .ql-grid {
      margin-top: 36px;
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 16px 12px;
      animation-delay: 60ms;
    }
    .ql-tile {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 9px;
      width: 88px; padding: 10px 4px 8px;
      background: transparent; border: none; cursor: pointer;
      font-family: inherit; color: var(--text);
      border-radius: 16px;
      transition: background 0.18s ease, transform 0.2s var(--zb-spring);
    }
    .ql-tile:hover { background: var(--glass); transform: translateY(-2px); }
    .ql-tile:active { transform: scale(0.96); }
    .ql-circle {
      width: 56px; height: 56px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: var(--tile-bg); border: 1px solid var(--tile-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(44px) saturate(180%);
      -webkit-backdrop-filter: blur(44px) saturate(180%);
      font-size: 21px; font-weight: 700;
      overflow: hidden;
      transition: transform 0.22s var(--zb-spring), box-shadow 0.22s ease;
    }
    .ql-tile:hover .ql-circle { transform: translateY(-1px) scale(1.05); }
    .ql-circle img { width: 30px; height: 30px; border-radius: 7px; }
    .ql-label { font-size: 12px; font-weight: 500; max-width: 82px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ql-x {
      position: absolute; top: 4px; right: 4px;
      width: 20px; height: 20px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55); color: #fff;
      border: none; cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .ql-tile:hover .ql-x { display: flex; }
    .ql-x:hover { background: #ff453a; }
    .ql-x svg { width: 9px; height: 9px; }
    .ql-add .ql-circle {
      border-style: dashed; border-color: var(--text-2);
      background: transparent; color: var(--text-2);
      font-weight: 400; font-size: 24px;
    }

    /* ---------------- Диалог новой ссылки ---------------- */
    .dlg-wrap {
      position: fixed; inset: 0; z-index: 50;
      display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .dlg-wrap.open { display: flex; }
    .dlg {
      width: min(420px, calc(100vw - 40px));
      border-radius: 18px;
      background: var(--tile-bg);
      border: 1px solid var(--tile-border);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(44px) saturate(180%);
      -webkit-backdrop-filter: blur(44px) saturate(180%);
      padding: 20px;
    }
    html[data-theme="dark"] .dlg { background: rgba(24, 24, 30, 0.92); }
    .dlg h3 { font-size: 15.5px; font-weight: 700; margin-bottom: 12px; }
    .dlg label { display: block; font-size: 11px; font-weight: 600; color: var(--text-2); margin: 9px 0 5px; }
    .dlg input {
      width: 100%; border: 0; outline: 0;
      border-radius: 10px;
      background: var(--glass);
      padding: 9px 12px;
      font: inherit; font-size: 13px; color: var(--text);
    }
    html[data-theme="light"] .dlg input { background: rgba(0, 0, 0, 0.05); }
    .dlg input:focus { box-shadow: 0 0 0 2px var(--accent); }
    .dlg-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .c-btn {
      appearance: none; border: 1px solid var(--tile-border); cursor: pointer;
      height: 34px; padding: 0 16px; border-radius: 17px;
      background: var(--tile-bg); color: var(--text);
      font: inherit; font-size: 13px; font-weight: 600;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .c-btn:hover { filter: brightness(1.08); }
    .c-btn:active { transform: scale(0.96); }
    .c-btn.primary { background: var(--accent); border-color: transparent; color: #fff; }

    /* ---------------- Карточка скачивания (веб) ---------------- */
    .dl-card {
      margin-top: 40px; padding: 16px 10px;
      border-radius: 16px; text-align: center;
      animation-delay: 120ms;
    }
    .dl-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 12px; }
    .dl-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .dl-btn {
      display: inline-flex; flex-direction: column; gap: 3px;
      padding: 10px 18px; border-radius: 12px;
      background: var(--accent); color: #fff;
      font-size: 12.5px; font-weight: 600; text-decoration: none;
      transition: transform 0.2s var(--zb-spring), filter 0.2s ease;
    }
    .dl-btn:hover { filter: brightness(1.08); transform: translateY(-1.5px); }
    .dl-btn:active { transform: scale(0.96); }
    .dl-btn.ghost { background: var(--tile-bg); color: var(--text); border: 1px solid var(--tile-border); }
    .dl-size { font-size: 10.5px; opacity: 0.8; font-weight: 400; }

    /* ---------------- Доступность ---------------- */
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 640px) {
      .ql-tile { width: 76px; }
      .ql-circle { width: 50px; height: 50px; border-radius: 14px; }
    }
  </style>
</head>
<body class="wp-aurora">

  <div class="corner-tools">
    <button id="gear" class="corner-btn" type="button" title="Настройки браузера" aria-label="Настройки браузера">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </div>

  <main class="wrap">
    <header class="greeting" id="greeting">
      <h1 id="greetTitle">Добрый день</h1>
      <p id="greetDate"></p>
    </header>

    <div id="qlGrid" class="ql-grid" aria-label="Быстрые ссылки"></div>

    <div class="dl-card" id="dlCard" hidden aria-label="Скачать Aero для Windows"></div>
  </main>

  <!-- Диалог добавления ссылки -->
  <div id="dlgWrap" class="dlg-wrap" role="dialog" aria-modal="true" aria-label="Новая ссылка">
    <div class="dlg">
      <h3 id="dlgTitle">Новая ссылка</h3>
      <label for="dlgUrl">Адрес сайта</label>
      <input id="dlgUrl" type="text" placeholder="Например youtube.com" spellcheck="false" autocomplete="off" />
      <label for="dlgName">Название (необязательно)</label>
      <input id="dlgName" type="text" placeholder="YouTube" spellcheck="false" autocomplete="off" />
      <div class="dlg-row">
        <button class="c-btn" id="dlgCancel" type="button">Отмена</button>
        <button class="c-btn primary" id="dlgSave" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* ---- режим: веб (внутри iframe) или десктоп (верхнеуровневый webview) ---- */
      var IN_WEB = false;
      try { IN_WEB = !!(window.parent && window.parent !== window); } catch (e) { IN_WEB = false; }
      var TAB_ID = null;
      try { TAB_ID = new URLSearchParams(location.search).get('t'); } catch (e) { TAB_ID = null; }

      /* ---- общие настройки Aero (тот же key, что и в приложении) ---- */
      var SKEY = 'aera.settings.v2';
      var DEFAULT_LINKS = [
        { title: 'YouTube', url: 'https://www.youtube.com' },
        { title: 'Google', url: 'https://www.google.com' },
        { title: 'Telegram', url: 'https://web.telegram.org' },
        { title: 'GitHub', url: 'https://github.com' },
        { title: 'Wiki', url: 'https://ru.wikipedia.org' },
        { title: 'Steam', url: 'https://store.steampowered.com' },
        { title: 'Twitter', url: 'https://x.com' },
        { title: 'Reddit', url: 'https://www.reddit.com' }
      ];
      var WALLPAPERS = ['aurora', 'sunset', 'forest', 'ocean', 'graphite', 'rose'];

      function getSettings() {
        try { return JSON.parse(localStorage.getItem(SKEY) || 'null') || {}; } catch (e) { return {}; }
      }
      function saveSettings(s) {
        try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) { /* noop */ }
      }

      function hostOf(url) {
        try { return new URL(url).hostname.replace(/^www\./i, ''); } catch (e) { return String(url || ''); }
      }
      function letterFor(url) {
        var host = hostOf(url).replace(/[^a-zа-я0-9]/gi, '');
        return (host.slice(0, 1) || 'A').toUpperCase();
      }
      function faviconUrl(url) {
        try {
          var h = new URL(url).hostname;
          return 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(h) + '&sz=64';
        } catch (e) { return ''; }
      }
      function normalizeUrl(raw) {
        var s = String(raw || '').trim();
        if (!s) return '';
        if (/^https?:\/\//i.test(s)) return s;
        if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?([\/?#].*)?$/i.test(s)) return 'https://' + s;
        return '';
      }
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      /* ---- тема, обои, затемнение ---- */
      var s = getSettings();
      var theme = s.theme === 'light' ? 'light' : s.theme === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : 'dark';
      document.documentElement.dataset.theme = theme;
      if (s.accent) {
        var ACCENTS = { safari: '#0a84ff', orange: '#ff9f0a', green: '#32d74b', pink: '#ff375f', graphite: '#98989d' };
        if (ACCENTS[s.accent]) {
          document.documentElement.style.setProperty('--accent', ACCENTS[s.accent]);
        }
      }
      function applyWallpaper() {
        var st = getSettings();
        WALLPAPERS.forEach(function (w) { document.body.classList.remove('wp-' + w); });
        document.body.classList.remove('wp-custom');
        var wp = WALLPAPERS.indexOf(st.wallpaper) >= 0 ? st.wallpaper : 'aurora';
        if (wp === 'aurora' && st.wallpaper == null) wp = 'aurora';
        if (st.wallpaper === 'custom' && st.wallpaperUrl) {
          document.body.style.setProperty('--wp-img', 'url("' + st.wallpaperUrl.replace(/"/g, '%22') + '")');
          document.body.classList.add('wp-custom');
        } else {
          document.body.classList.add('wp-' + wp);
        }
        document.body.style.setProperty('--wp-dim', String((st.wallpaperDim == null ? 20 : st.wallpaperDim) / 100));
      }
      applyWallpaper();

      /* ---- приветствие ---- */
      function renderGreeting() {
        var h = new Date().getHours();
        var greet = h < 5 ? 'Доброй ночи' : h < 11 ? 'Доброе утро' : h < 17 ? 'Добрый день' : h < 23 ? 'Добрый вечер' : 'Доброй ночи';
        document.getElementById('greetTitle').textContent = greet;
        document.getElementById('greetDate').textContent =
          new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
      }
      renderGreeting();

      /* ---- навигация наружу ---- */
      function nav(url) {
        if (IN_WEB) {
          try { window.parent.postMessage({ __zaeranav: true, url: url, tab: TAB_ID }, '*'); } catch (e) { /* noop */ }
        } else {
          window.location.href = url;
        }
      }

      /* ---- быстрые ссылки ---- */
      var grid = document.getElementById('qlGrid');

      function links() {
        var st = getSettings();
        return Array.isArray(st.quickLinks) && st.quickLinks.length ? st.quickLinks : DEFAULT_LINKS.slice();
      }

      function renderTiles() {
        grid.textContent = '';
        var list = links();
        list.forEach(function (l, i) {
          var btn = el('button', 'ql-tile');
          btn.type = 'button';
          btn.title = (l.title || hostOf(l.url)) + ' — ' + hostOf(l.url);

          var circle = el('span', 'ql-circle');
          var img = el('img');
          img.src = faviconUrl(l.url);
          img.alt = '';
          img.referrerPolicy = 'no-referrer';
          img.onerror = function () { img.remove(); circle.textContent = letterFor(l.url); };
          circle.appendChild(img);
          btn.appendChild(circle);

          btn.appendChild(el('span', 'ql-label', l.title || hostOf(l.url)));

          var x = el('button', 'ql-x');
          x.type = 'button';
          x.title = 'Удалить';
          x.setAttribute('aria-label', 'Удалить ' + (l.title || l.url));
          x.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M4.5 4.5 L11.5 11.5 M11.5 4.5 L4.5 11.5" stroke-width="1.8" stroke-linecap="round"/></svg>';
          x.addEventListener('click', function (e) {
            e.stopPropagation();
            var st = getSettings();
            st.quickLinks = links();
            st.quickLinks.splice(i, 1);
            saveSettings(st);
            renderTiles();
          });
          btn.appendChild(x);

          btn.addEventListener('click', function () { nav(l.url); });
          grid.appendChild(btn);
        });

        var add = el('button', 'ql-tile ql-add');
        add.type = 'button';
        add.title = 'Добавить ссылку';
        add.setAttribute('aria-label', 'Добавить ссылку');
        var ac = el('span', 'ql-circle', '+');
        add.appendChild(ac);
        add.appendChild(el('span', 'ql-label', 'Добавить'));
        add.addEventListener('click', function () {
          document.getElementById('dlgUrl').value = '';
          document.getElementById('dlgName').value = '';
          document.getElementById('dlgWrap').classList.add('open');
          setTimeout(function () { try { document.getElementById('dlgUrl').focus(); } catch (e) {} }, 60);
        });
        grid.appendChild(add);
      }
      renderTiles();

      /* ---- диалог ссылки ---- */
      var dlgWrap = document.getElementById('dlgWrap');
      function dlgClose() { dlgWrap.classList.remove('open'); }
      document.getElementById('dlgCancel').addEventListener('click', dlgClose);
      dlgWrap.addEventListener('click', function (e) { if (e.target === dlgWrap) dlgClose(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') dlgClose(); });
      document.getElementById('dlgSave').addEventListener('click', function () {
        var url = normalizeUrl(document.getElementById('dlgUrl').value);
        if (!url) { document.getElementById('dlgUrl').focus(); return; }
        var title = String(document.getElementById('dlgName').value || '').trim() || hostOf(url);
        var st = getSettings();
        st.quickLinks = links();
        st.quickLinks.push({ title: title, url: url });
        saveSettings(st);
        dlgClose();
        renderTiles();
      });
      document.getElementById('dlgUrl').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('dlgSave').click(); });
      document.getElementById('dlgName').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('dlgSave').click(); });

      /* ---- шестерёнка: настройки ---- */
      document.getElementById('gear').addEventListener('click', function () {
        if (IN_WEB) {
          /* настройки живут в полном интерфейсе хоста */
          try { window.parent.postMessage({ __zaeranav: true, url: 'aero://settings', tab: TAB_ID }, '*'); } catch (e) { /* noop */ }
        } else {
          /* автономная веб-страница: ведём в полноценное веб-демо */
          window.location.href = '/aero/';
        }
      });

      /* ---- сообщения хоста ---- */
      window.addEventListener('message', function (e) {
        if (!e.data || typeof e.data !== 'object') return;
        if (window.parent !== window && e.source !== window.parent) return;
        if (e.source === window) return;
        if (e.data.__zaeratheme === 'dark' || e.data.__zaeratheme === 'light') {
          document.documentElement.dataset.theme = e.data.__zaeratheme;
        }
        if (e.data.__zaerawallpaper) {
          var st = getSettings();
          st.wallpaper = e.data.__zaerawallpaper;
          saveSettings(st);
          applyWallpaper();
        }
      });

      /* ---- карточка скачивания (только веб) ---- */
      if (IN_WEB) {
        fetch('/api/desktop-builds')
          .then(function (r) { return r.json(); })
          .then(function (j) {
            var builds = (j && Array.isArray(j.builds)) ? j.builds : [];
            if (!builds.length) return;
            var card = document.getElementById('dlCard');
            card.hidden = false;
            card.textContent = '';

            var title = el('div', 'dl-title', 'Нужен полноценный браузер на движке Chromium?');
            card.appendChild(title);

            var wrap = el('div', 'dl-btns');
            var mk = function (b, label, ghost) {
              if (!b) return;
              var a = el('a', 'dl-btn' + (ghost ? ' ghost' : ''));
              a.href = b.url;
              a.setAttribute('download', b.file || '');
              a.appendChild(el('span', null, label));
              a.appendChild(el('span', 'dl-size', (Number(b.sizeMb) || 0) + ' МБ'));
              wrap.appendChild(a);
            };
            mk(builds.filter(function (b) { return b.kind === 'setup'; })[0], 'Установщик', false);
            mk(builds.filter(function (b) { return b.kind === 'portable'; })[0], 'Портативная', true);
            card.appendChild(wrap);
          })
          .catch(function () { /* нет сборок — карточку не показываем */ });
      }
    })();
  </script>
</body>
</html>
